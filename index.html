<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO Scanner</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .btn {
      background-color: #e11d48;
      color: white;
      padding: 16px 24px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: 16px;
    }
    #preview {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 16px;
      display: none;
    }
    #status {
      margin-top: 16px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🧱 LEGO Scanner</h1>
    <p>Snap a photo of a brick to scan and add it to your inventory.</p>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
    
    <button class="btn" onclick="document.getElementById('cameraInput').click()">📷 Take Photo</button>
    
    <img id="preview" alt="Preview">
    <div id="status"></div>
  </div>

  <script>
    // Register Service Worker for PWA installation
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');

    cameraInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Show preview image
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      status.innerText = 'Uploading to backend...';

      // Send to Vercel API backend
      const formData = new FormData();
      formData.append('image', file);

      try {
        const response = await fetch('https://lego-cloud-backend.vercel.app/api/scan-and-add', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        if (response.ok) {
          status.innerText = `✅ Success: Added ${data.name || 'Brick'} to inventory!`;
        } else {
          status.innerText = `❌ Error: ${data.error || 'Failed to analyze brick.'}`;
        }
      } catch (err) {
        status.innerText = '❌ Connection error to Vercel backend.';
      }
    });
  </script>
</body>
</html>
